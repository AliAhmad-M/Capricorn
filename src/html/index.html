<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'">
  <title>Capricorn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body data-state="idle">  
  <!-- Loading screen -->
  <div id="loader" class="loader" aria-label="Loading">
    <div class="loader-grid"></div>

    <div class="loader-box">
      <h1 class="loader-title" data-text="CAPRICORN">CAPRICORN</h1>

      <div class="loader-bar"><div id="loader-fill" class="loader-fill"></div></div>
      <div class="loader-meta">
        <span id="loader-label" role="status">Loading assets</span>
        <span id="loader-percent">000%</span>
      </div>

      <div id="loader-log" class="loader-log" aria-hidden="true"></div>
      <p class="loader-start">Press any key</p>
    </div>
  </div>

  <main id="app" class="app">
    <!-- Portrait panel -->
    <section class="side">
      <div class="portrait-wrap">
        <div class="frame">
          <div class="frame-inner portrait">
            <img id="sprite" class="sprite" src="../../assets/idle.jpg" alt="Capricorn" draggable="false">
            <div class="ghost ghost-c" aria-hidden="true"></div>
            <div class="ghost ghost-r" aria-hidden="true"></div>
            <div class="sweep"></div>
          </div>
        </div>
      </div>
      <div class="status" role="status" aria-live="polite">
        <span class="dot"></span>
        <span id="status-label">Idle</span>
      </div>
    </section>

    <!-- Conversation panel -->
    <section class="main">
      <div class="frame quiet panel-frame">
        <div class="frame-inner panel">
          <div class="panel-bar">
            <span class="panel-title">CAPRICORN</span>
            <div class="panel-actions">
              <button id="dock" class="dock" type="button"></button>
              <button id="settings" class="dock settings-button" type="button" aria-label="Settings" title="Settings">
                <svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33h-.08a1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51h-.08a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82v-.08a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1v-.08a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
              </button>
            </div>
          </div>
          <div id="log" class="log" aria-live="polite">
            <p id="empty" class="empty">
              Ask Capricorn to find a file, check the time, send an email or set a reminder.
            </p>
          </div>
          <!-- <div class="chips">
            <button class="chip" type="button">What time is it?</button>
            <button class="chip" type="button">Find my latest resume file</button>
            <button class="chip" type="button">Email Sam about tomorrow's meeting</button>
            <button class="chip" type="button">Remind me to stretch at 6 pm</button>
          </div> -->
          <form id="form" class="composer" autocomplete="off">
            <input id="input" type="text" placeholder="Type a request" aria-label="Request">
            <button class="send" type="submit">Send</button>
          </form>
        </div>
      </div>
    </section>
  </main>
  <main id="settings-page" class="settings-app" hidden>
    <div class="frame quiet settings-frame">
      <section class="frame-inner settings-panel">
        <header class="panel-bar">
          <span class="panel-title">SETTINGS</span>
          <button id="settings-back" class="dock" type="button">Back to Capricorn</button>
        </header>
        <p class="settings-description">Choose a GMT offset for Capri's date and time answers.</p>
        <label class="settings-field" for="timezone">
          <span>Timezone</span>
          <span class="settings-select-wrap">
            <select id="timezone" hidden></select>
            <button id="timezone-toggle" class="settings-select-toggle" type="button"
                    role="combobox" aria-controls="timezone-options" aria-haspopup="listbox"
                    aria-expanded="false" aria-label="Timezone" disabled>
              <span id="timezone-label">Loading timezones...</span>
              <span class="settings-select-arrow" aria-hidden="true"></span>
            </button>
            <div id="timezone-options" class="settings-select-options" role="listbox"
                 aria-label="Timezone options" hidden></div>
          </span>
        </label>
        <p id="timezone-id" class="settings-timezone-id" aria-live="polite"></p>
        <p id="settings-status" class="settings-status" role="status" aria-live="polite"></p>
      </section>
    </div>
  </main>
  <script src="../js/renderer.js"></script>
  <script src="../js/settings.js"></script>
</body>
</html>
